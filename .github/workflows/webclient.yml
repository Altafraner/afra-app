name: webclient

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: ["*"]
    paths:
      - "WebClient/**"
      - ".github/workflows/webclient.yml"
  pull_request:
    branches: ["*"]
    paths:
      - "WebClient/**"
      - ".github/workflows/webclient.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: ./WebClient
        run: npm ci
      - name: Build
        working-directory: ./WebClient
        run: npm run build-only
      - name: Type check
        working-directory: ./WebClient
        run: npm run type-check
